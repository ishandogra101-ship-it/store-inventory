<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Store Inventory — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="inventory.css">
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="handbook.js"></script>
</head>
<body>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<div class="app-layout" id="app" style="display:none">

  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" data-ic="box"></span>
      <span class="brand-name">Store <span>Inventory</span></span>
    </div>
    <nav class="nav">
      <span class="nav-user" id="nav-user"></span>
      <a href="index.html"    class="icon-btn"        data-ic="box"      title="Stock"></a>
      <a href="stats.html"    class="icon-btn"        data-ic="chart"    title="Statistics"></a>
      <a href="settings.html" class="icon-btn active" data-ic="settings" title="Settings"></a>
      <button class="icon-btn" id="handbook-btn" data-ic="book" title="Download handbook (PDF)"></button>
      <span class="nav-sep"></span>
      <button class="icon-btn danger" id="logout-btn" data-ic="logout" title="Sign out"></button>
    </nav>
  </header>

  <div class="content-scroll">
    <div class="content-inner" style="max-width:680px;">

      <!-- ITEMS -->
      <div class="settings-section">
        <div class="settings-section-header">
          <div class="settings-section-title"><span data-ic="box"></span>Items</div>
          <div class="section-meta" id="items-count"></div>
        </div>
        <div class="settings-section-body">
          <div class="settings-add-row">
            <div class="grow">
              <div class="fld-label">Item name</div>
              <input class="mi" id="item-name" placeholder="e.g. Phenyl" maxlength="60">
            </div>
            <div class="w-unit">
              <div class="fld-label">Unit</div>
              <select class="ms" id="item-unit">
                <option value="litre">Litre</option>
                <option value="kg">Kg</option>
                <option value="pieces">Pieces</option>
                <option value="rolls">Rolls</option>
                <option value="packets">Packets</option>
                <option value="boxes">Boxes</option>
                <option value="bottles">Bottles</option>
                <option value="bags">Bags</option>
                <option value="pairs">Pairs</option>
                <option value="sets">Sets</option>
              </select>
            </div>
            <div class="w-thr">
              <div class="fld-label">Min. threshold</div>
              <input class="mi" id="item-thr" type="number" min="0" step="any" placeholder="0">
            </div>
            <button class="settings-add-btn" id="add-item-btn"><span data-ic="plus"></span>Add</button>
          </div>
          <div class="settings-list" id="items-list">
            <div class="settings-empty" id="items-empty">No items yet. Add one above.</div>
          </div>
        </div>
      </div>

      <!-- SUPPLIERS -->
      <div class="settings-section">
        <div class="settings-section-header">
          <div class="settings-section-title"><span data-ic="truck"></span>Suppliers</div>
          <div class="section-meta" id="suppliers-count"></div>
        </div>
        <div class="settings-section-body">
          <div class="settings-add-row">
            <div class="grow">
              <div class="fld-label">Supplier name</div>
              <input class="mi" id="supplier-name" placeholder="e.g. ABC Chemicals" maxlength="80">
            </div>
            <button class="settings-add-btn" id="add-supplier-btn"><span data-ic="plus"></span>Add</button>
          </div>
          <div class="settings-list" id="suppliers-list">
            <div class="settings-empty" id="suppliers-empty">No suppliers yet. Add one above.</div>
          </div>
        </div>
      </div>

      <!-- LOCATIONS -->
      <div class="settings-section">
        <div class="settings-section-header">
          <div class="settings-section-title"><span data-ic="pin"></span>Locations</div>
          <div class="section-meta" id="locations-count"></div>
        </div>
        <div class="settings-section-body">
          <div class="settings-add-row">
            <div class="grow">
              <div class="fld-label">Location name</div>
              <input class="mi" id="location-name" placeholder="e.g. Block A Washroom" maxlength="80">
            </div>
            <button class="settings-add-btn" id="add-location-btn"><span data-ic="plus"></span>Add</button>
          </div>
          <div class="settings-list" id="locations-list">
            <div class="settings-empty" id="locations-empty">No locations yet. Add one above.</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Mobile bottom tab bar -->
<div class="mobile-tab-bar">
  <a href="index.html"    class="mob-tab"        style="text-decoration:none"><span data-ic="box"></span>Stock</a>
  <a href="stats.html"    class="mob-tab"        style="text-decoration:none"><span data-ic="chart"></span>Stats</a>
  <a href="settings.html" class="mob-tab active" style="text-decoration:none"><span data-ic="settings"></span>Settings</a>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
import { initializeApp }                                      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut }               from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc,
         getDocs, addDoc, deleteDoc, onSnapshot,
         getDoc, setDoc,
         serverTimestamp, query, orderBy }                    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = window.icon(el.dataset.ic));

const app  = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let itemsCache  = [];
let locationsCache = [];

/* ── Auth ── */
onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  document.getElementById('nav-user').textContent = user.email;
  document.getElementById('loading').classList.add('gone');
  document.getElementById('app').style.display = 'flex';
  initSettings();
});

document.getElementById('logout-btn').addEventListener('click', doSignOut);
async function doSignOut() { await signOut(auth); window.location.href = 'login.html'; }

document.getElementById('handbook-btn').addEventListener('click', () => {
  try {
    window.generateHandbook({ itemCount: itemsCache.length, locationCount: locationsCache.length });
    toast('Handbook downloaded.', 'ok');
  } catch (e) { console.error(e); toast('Could not generate handbook.', 'err'); }
});

/* ── Toast ── */
function toast(msg, type = '') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' toast-'+type : '');
  t.innerHTML = (type === 'ok' ? window.icon('check') : type === 'err' ? window.icon('alert') : '') + `<span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800);
}

function initSettings() {
  listenItems();
  loadConfig('suppliers');
  loadConfig('locations');
  setupItemAdd();
  setupSupplierAdd();
  setupLocationAdd();
}

/* ── ITEMS ── */
function listenItems() {
  const q = query(collection(db, 'invItems'), orderBy('name'));
  onSnapshot(q, snap => {
    itemsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderItems(itemsCache);
  });
}

function renderItems(items) {
  const list  = document.getElementById('items-list');
  const empty = document.getElementById('items-empty');
  const count = document.getElementById('items-count');
  count.textContent = items.length ? `${items.length} item${items.length !== 1 ? 's' : ''}` : '';
  list.querySelectorAll('.settings-item').forEach(e => e.remove());
  if (!items.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  items.forEach(item => {
    const thr = item.minThreshold || 0;
    const row = document.createElement('div');
    row.className = 'settings-item';
    row.innerHTML = `
      <span class="settings-item-name">${esc(item.name)}</span>
      <span class="settings-item-badge">${esc(item.unit)}</span>
      ${thr > 0 ? `<span class="settings-item-badge thr">min ${esc(String(thr))}</span>` : ''}
      <span class="settings-item-badge stock">${item.currentStock || 0} in stock</span>
      <button class="settings-del-btn" title="Delete item">${window.icon('x')}</button>`;
    row.querySelector('.settings-del-btn').addEventListener('click', () => confirmDeleteItem(item));
    list.appendChild(row);
  });
}

function setupItemAdd() {
  const nameInp = document.getElementById('item-name');
  const unitSel = document.getElementById('item-unit');
  const thrInp  = document.getElementById('item-thr');
  const btn     = document.getElementById('add-item-btn');
  async function doAdd() {
    const name = nameInp.value.trim();
    if (!name) { toast('Enter an item name.', 'err'); return; }
    let thr = parseFloat(thrInp.value);
    if (isNaN(thr) || thr < 0) thr = 0;
    btn.disabled = true;
    try {
      await addDoc(collection(db, 'invItems'), {
        name, unit: unitSel.value, minThreshold: thr, currentStock: 0, createdAt: serverTimestamp()
      });
      nameInp.value = ''; thrInp.value = '';
      toast(`"${name}" added.`, 'ok');
    } catch { toast('Failed to add item.', 'err'); }
    btn.disabled = false;
  }
  btn.addEventListener('click', doAdd);
  nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
  thrInp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
}

async function confirmDeleteItem(item) {
  if (!confirm(`Delete "${item.name}"?\n\nExisting transaction history will be kept, but the item will no longer appear in dropdowns.`)) return;
  try {
    await deleteDoc(doc(db, 'invItems', item.id));
    toast(`"${item.name}" deleted.`);
  } catch { toast('Failed to delete item.', 'err'); }
}

/* ── CONFIG (suppliers / locations) ── */
async function loadConfig(key) {
  const snap = await getDoc(doc(db, 'invConfig', key));
  const items = snap.exists() ? (snap.data().items || []) : [];
  if (key === 'locations') locationsCache = items;
  renderConfig(key, items);
}

function renderConfig(key, items) {
  const list  = document.getElementById(`${key}-list`);
  const empty = document.getElementById(`${key}-empty`);
  const count = document.getElementById(`${key}-count`);
  count.textContent = items.length ? `${items.length}` : '';
  list.querySelectorAll('.settings-item').forEach(e => e.remove());
  if (!items.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'settings-item';
    row.innerHTML = `
      <span class="settings-item-name">${esc(item.name)}</span>
      <button class="settings-del-btn" title="Remove">${window.icon('x')}</button>`;
    row.querySelector('.settings-del-btn').addEventListener('click', () => deleteConfigItem(key, item.id));
    list.appendChild(row);
  });
}

async function saveConfig(key, items) { await setDoc(doc(db, 'invConfig', key), { items }); }

async function deleteConfigItem(key, id) {
  const snap = await getDoc(doc(db, 'invConfig', key));
  const items = snap.exists() ? (snap.data().items || []) : [];
  const updated = items.filter(i => i.id !== id);
  await saveConfig(key, updated);
  if (key === 'locations') locationsCache = updated;
  renderConfig(key, updated);
  toast('Removed.');
}

function setupSupplierAdd() {
  const inp = document.getElementById('supplier-name');
  const btn = document.getElementById('add-supplier-btn');
  async function doAdd() {
    const name = inp.value.trim();
    if (!name) { toast('Enter a supplier name.', 'err'); return; }
    btn.disabled = true;
    try {
      const snap = await getDoc(doc(db, 'invConfig', 'suppliers'));
      const items = snap.exists() ? (snap.data().items || []) : [];
      if (items.some(s => s.name.toLowerCase() === name.toLowerCase())) {
        toast('Supplier already exists.', 'err'); btn.disabled = false; return;
      }
      items.push({ id: 'sup_' + Date.now(), name });
      await saveConfig('suppliers', items);
      inp.value = '';
      renderConfig('suppliers', items);
      toast(`"${name}" added.`, 'ok');
    } catch { toast('Failed to save.', 'err'); }
    btn.disabled = false;
  }
  btn.addEventListener('click', doAdd);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
}

function setupLocationAdd() {
  const inp = document.getElementById('location-name');
  const btn = document.getElementById('add-location-btn');
  async function doAdd() {
    const name = inp.value.trim();
    if (!name) { toast('Enter a location name.', 'err'); return; }
    btn.disabled = true;
    try {
      const snap = await getDoc(doc(db, 'invConfig', 'locations'));
      const items = snap.exists() ? (snap.data().items || []) : [];
      if (items.some(l => l.name.toLowerCase() === name.toLowerCase())) {
        toast('Location already exists.', 'err'); btn.disabled = false; return;
      }
      items.push({ id: 'loc_' + Date.now(), name });
      await saveConfig('locations', items);
      locationsCache = items;
      inp.value = '';
      renderConfig('locations', items);
      toast(`"${name}" added.`, 'ok');
    } catch { toast('Failed to save.', 'err'); }
    btn.disabled = false;
  }
  btn.addEventListener('click', doAdd);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
